<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ayan | Regions</title>
 
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
 
    <style>
        :root {
            --nav: #f0d06c;
            --ink: #3a2a12;
            --brown: #6b3a06;
            --gold: #c8922a;
            --green: #2f8f3f;
            --card: #fffdf6;
            --line: #e3d6ae;
        }
 
        * { box-sizing: border-box; margin: 0; padding: 0; }
 
        body {
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            min-height: 100vh;
            background: linear-gradient(160deg, #eef0d6 0%, #f4edcf 55%, #f7e6bd 100%);
        }
 
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 32px 40px 60px;
            align-items: start;
        }
 
        h1 { font-size: 2rem; color: var(--brown); margin-bottom: 6px; }
        .sub { margin-bottom: 20px; line-height: 1.5; }
 
        select {
            width: 100%;
            padding: 13px 14px;
            font: inherit;
            font-size: 1.05rem;
            color: var(--ink);
            background: var(--card);
            border: 2px solid var(--gold);
            border-radius: 10px;
            cursor: pointer;
        }
        select:focus { outline: 3px solid #f0d06c; }
 
        .region-head { margin: 26px 0 14px; }
        .region-head h2 { color: var(--brown); font-size: 1.4rem; }
        .region-head p { margin-top: 4px; color: #5a4a30; }
 
        .go {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 18px;
            background: var(--green);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
        }
        .go:hover { filter: brightness(1.08); }
 
        .places { display: grid; gap: 12px; }
 
        .place {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 5px solid var(--gold);
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 0 2px 6px rgba(107, 58, 6, .08);
        }
 
        .place h3 {
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: baseline;
        }
 
        .tag {
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            background: #f6e7b8;
            color: var(--brown);
            padding: 2px 8px;
            border-radius: 99px;
            white-space: nowrap;
        }
 
        .place p { margin-top: 6px; font-size: .95rem; line-height: 1.45; }
 
        .empty {
            margin-top: 26px;
            padding: 22px;
            border: 2px dashed var(--line);
            border-radius: 12px;
            text-align: center;
            color: #7a6a4a;
        }
 
        #proceedBtn {
            margin-top: 22px;
            padding: 14px 24px;
            border: 1px solid var(--gold);
            border-radius: 10px;
            background: var(--brown);
            color: #fffdf6;
            font: inherit;
            font-weight: bold;
            line-height: 1.4;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(107, 58, 6, .18);
            transition: background .18s, box-shadow .18s;
        }
        #proceedBtn:hover:not(:disabled) {
            background: #85490c;
            box-shadow: 0 6px 14px rgba(107, 58, 6, .24);
        }
        #proceedBtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
        #proceedBtn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

        #map {
            position: sticky;
            top: 20px;
            height: calc(100vh - 120px);
            min-height: 420px;
            background: rgba(255, 253, 246, .55);
            border: 2px solid var(--gold);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #7a6a4a;
            padding: 10px;
        }
        #map img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
 
        @media (max-width: 860px) {
            main { grid-template-columns: 1fr; padding: 20px; }
            #map { position: static; height: 320px; order: -1; }
        }
    </style>
</head>
 
<body>
 
    <header id="topbar">
        <a href="index.html" class="logo">
            <img src="ayan_main.svg" alt="Ayan">
        </a>
        <nav id="menu"></nav>
    </header>
 
    <main>
        <!-- LEFT: dropdown + places -->
        <section>
            <h1>Explore the Regions</h1>
            <p class="sub">Select one or more regions, then choose your places.</p>
 
            <div id="regionSelect" aria-label="Select regions"></div>
 
            <div id="output">
                <div class="empty">Loading regions...</div>
            </div>
            <button id="proceedBtn" class="next-btn" disabled>Proceed to Select Places &rarr;</button>
        </section>
 
        <!-- RIGHT: supplied region guide -->
        <aside id="map" aria-label="Varanasi region guide">
            <img src="regions-map.jpg" alt="Map of Varanasi showing Sarnath and Northern Varanasi, Old City and Central Ghats, BHU and Southern Varanasi, and Ramnagar and Eastern Riverbank">
        </aside>
    </main>
 
    <script>
        const API = location.port === "5000" ? "" : "http://127.0.0.1:5000";
        const select = document.getElementById("regionSelect");
        const out = document.getElementById("output");
        const proceed = document.getElementById("proceedBtn");
        let selected = new Set();
        try { selected = new Set(JSON.parse(localStorage.getItem("selectedRegions") || "[]")); } catch (e) {}
        function update() {
            localStorage.setItem("selectedRegions", JSON.stringify([...selected]));
            out.textContent = selected.size + " region(s) selected";
            proceed.disabled = selected.size === 0;
        }
        async function loadRegions() {
            try {
                const res = await fetch(API + "/api/regions");
                const data = await res.json();
                if (!res.ok || !Array.isArray(data.regions)) throw new Error(data.error || "Unable to load regions.");
                const names = data.regions.map(r => r.region_name).filter(Boolean);
                selected = new Set([...selected].filter(n => names.includes(n)));
                for (const name of names) {
                    const label = document.createElement("label");
                    label.className = "place";
                    label.style.display = "block";
                    const input = document.createElement("input");
                    input.type = "checkbox";
                    input.value = name;
                    input.checked = selected.has(name);
                    input.addEventListener("change", () => {
                        input.checked ? selected.add(name) : selected.delete(name);
                        localStorage.removeItem("trip_result");
                        update();
                    });
                    label.append(input, " " + name);
                    select.append(label);
                }
                update();
            } catch (e) { out.textContent = e.message; }
        }
        proceed.addEventListener("click", () => {
            if (selected.size) location.href = "places.html";
        });
        loadRegions();
    </script>
 
</body>
 
</html>
