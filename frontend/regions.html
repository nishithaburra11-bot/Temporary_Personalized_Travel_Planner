<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ayan | Regions</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <style>
        :root {
            --nav: #f0d06c;
            --ink: #3a2a12;
            --brown: #6b3a06;
            --gold: #c8922a;
            --green: #2f8f3f;
            --card: #fffdf6;
            --line: #e3d6ae;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            min-height: 100vh;
            background: linear-gradient(160deg, #eef0d6 0%, #f4edcf 55%, #f7e6bd 100%);
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 32px 40px 60px;
            align-items: start;
        }

        h1 { font-size: 2rem; color: var(--brown); margin-bottom: 6px; }
        .sub { margin-bottom: 20px; line-height: 1.5; }

        select {
            width: 100%;
            padding: 13px 14px;
            font: inherit;
            font-size: 1.05rem;
            color: var(--ink);
            background: var(--card);
            border: 2px solid var(--gold);
            border-radius: 10px;
            cursor: pointer;
        }
        select:focus { outline: 3px solid #f0d06c; }

        .region-head { margin: 26px 0 14px; }
        .region-head h2 { color: var(--brown); font-size: 1.4rem; }
        .region-head p { margin-top: 4px; color: #5a4a30; }

        .places { display: grid; gap: 12px; }

        .place {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 5px solid var(--gold);
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 0 2px 6px rgba(107, 58, 6, .08);
        }

        .place h3 {
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: baseline;
        }

        .tag {
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            background: #f6e7b8;
            color: var(--brown);
            padding: 2px 8px;
            border-radius: 99px;
            white-space: nowrap;
        }

        .place p { margin-top: 6px; font-size: .95rem; line-height: 1.45; }

        .empty {
            margin-top: 26px;
            padding: 22px;
            border: 2px dashed var(--line);
            border-radius: 12px;
            text-align: center;
            color: #7a6a4a;
        }

        #map {
            position: sticky;
            top: 20px;
            height: calc(100vh - 120px);
            min-height: 420px;
            background: rgba(255, 253, 246, .55);
            border: 2px dashed var(--gold);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #7a6a4a;
            padding: 20px;
        }

        @media (max-width: 860px) {
            main { grid-template-columns: 1fr; padding: 20px; }
            #map { position: static; height: 320px; order: -1; }
        }
        .next-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: #B45F06;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }
        .next-btn:hover {
            background: #7A3E00;
        }
    </style>
</head>

<body>

    <header id="topbar">
        <a href="index.html" class="logo">
            <img src="ayan_main.svg" alt="Ayan">
        </a>
        <nav id="menu"></nav>
    </header>

    <main>
        <!-- LEFT: dropdown + places -->
        <section>
            <h1>Explore the Regions</h1>
            <p class="sub">Pick a region to see the places worth visiting there.</p>

            <select id="regionSelect" aria-label="Select a region">
                <option value="">-- Select a region --</option>
                
            </select>

            <div id="output">
                <div class="empty">Choose a region above to see its places.</div>
            </div>
            <div style="margin-top: 20px;">
                <a href="places.html" class="next-btn">Proceed to Select Places &rarr;</a>
            </div>
        </section>

        <!-- RIGHT: map placeholder -->
        <aside id="map">Guiding map goes here</aside>
    </main>

    <script>
        const API = "http://127.0.0.1:5000";

        // IDs must match the backend's region_id values
        const REGIONS = {
            "bhu-south":       "BHU and Southern Varanasi",
            "old-city":        "Old City and Central Ghats",
            "sarnath-north":   "Sarnath and Northern Varanasi",
            "ramnagar-east":   "Ramnagar and Eastern Riverbank",
            "rural-kashi":     "Rural Kashi",
            "chandauli":       "Chandauli region",
            "mirzapur-chunar": "Mirzapur and Chunar Region",
            "kaimoor":         "Kaimoor region"
        };

        const select = document.getElementById("regionSelect");
        const out = document.getElementById("output");
        let controller; // cancels the previous request

        // Fill the dropdown
        for (const id in REGIONS) {
            select.add(new Option(REGIONS[id], id));
        }

        // Escape text before putting it into HTML
        function esc(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function showMessage(message) {
            out.innerHTML = `<div class="empty">${esc(message)}</div>`;
        }

        async function loadPlaces(regionId) {
            if (controller) controller.abort();

            if (!regionId) {
                showMessage("Choose a region above to see its places.");
                return;
            }

            showMessage("Loading places...");
            controller = new AbortController();

            try {
                const response = await fetch(
                    `${API}/api/places?region_id=${encodeURIComponent(regionId)}`,
                    { signal: controller.signal }
                );
                if (!response.ok) throw new Error("Request failed: " + response.status);

                const data = await response.json();
                if (data.success === false || !Array.isArray(data.places)) {
                    throw new Error(data.message || "Invalid response");
                }

                render(data.places, regionId);
            } catch (error) {
                if (error.name === "AbortError") return; // a newer request took over
                console.error(error);
                showMessage("Unable to load places. Check that the backend is running.");
            }
        }

        function render(places, regionId) {
            if (places.length === 0) {
                showMessage("No places found in this region.");
                return;
            }

            // Group by category
            const groups = {};
            places.forEach(p => {
                const category = (p.category || "Other").trim() || "Other";
                (groups[category] = groups[category] || []).push(p);
            });

            let html = `<div class="region-head"><h2>${esc(REGIONS[regionId])}</h2></div>`;

            Object.keys(groups).sort().forEach(category => {
                html += `<div class="region-head"><h2>${esc(category)} (${groups[category].length})</h2></div>`;
                html += `<div class="places">`;
                groups[category].forEach(p => {
                    html += `
                        <article class="place">
                            <h3>${esc(p.place_name || "Unnamed place")}
                                <span class="tag">${esc(category)}</span>
                            </h3>
                            <p>${esc(p.speciality_description || "No description available.")}</p>
                        </article>`;
                });
                html += `</div>`;
            });

            out.innerHTML = html;
        }

        select.addEventListener("change", () => loadPlaces(select.value));
    </script>

</body>
</html>
